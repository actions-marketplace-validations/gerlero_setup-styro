name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
        styro-version:
          - latest
        include:
          - os: ubuntu-latest
            styro-version: 0.1.39
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Styro ${{ matrix.styro-version }}
        uses: ./
        with:
          styro-version: ${{ matrix.styro-version }}
      - name: Test Styro
        env:
          STYRO_VERSION: ${{ matrix.styro-version }}
        run: |
          styro --version
          if [ "$STYRO_VERSION" != "latest" ]; then
            styro --version | grep "styro $STYRO_VERSION"
          fi
